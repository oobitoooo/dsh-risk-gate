    <circle cx="84" cy="132" r="20" fill="#0b1220" stroke="#34d399" stroke-width="8"/>
    <rect x="76" y="132" width="16" height="46" rx="8" fill="#34d399"/>
  </g>

  <text x="340" y="220" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="76" font-weight="700" fill="#f1f5f9">dsh-risk-gate</text>
  <text x="342" y="278" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#94a3b8">human-in-the-loop gate for jailbroken DSH setups</text>

  <g font-family="ui-monospace, Consolas, monospace" font-size="24" fill="#cbd5e1">
